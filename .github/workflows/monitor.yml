name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# 외부 액션은 쓰지 않는다. 저장소 토큰은 바로 앞 실행 결과를 읽는 데만 쓴다.
permissions:
  actions: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check health and operator alerts
        env:
          API_BASE: https://api.collog.live
          OPS_MONITOR_CODE: ${{ secrets.OPS_MONITOR_CODE }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          # 공개 저장소라 실행 기록은 누구나 본다. 기록에는 문제의 종류 코드만 찍고 건수·서버
          # 문구는 찍지 않는다(웹훅 본문에만 넣는다). 비밀 값(접속 코드·웹훅 주소·토큰)은 어떤
          # 출력에도 넣지 않는다.
          base = os.environ["API_BASE"]
          agent = {"User-Agent": "collog-monitor (GitHub Actions)"}
          code_pattern = re.compile(r"[A-Z_]{1,40}")
          health_retry = float(os.environ.get("HEALTH_RETRY_SECONDS", "20"))


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              # 다른 호스트로 넘겨질 때 접속 코드·토큰 헤더가 따라가지 않게 넘겨짐을 따르지 않는다
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(NoRedirect)


          def fetch(url, headers=None, data=None):
              request = urllib.request.Request(
                  url, data=data, headers={**agent, **(headers or {})}
              )
              with opener.open(request, timeout=20) as response:
                  return response.status, response.read()


          def check_health():
              try:
                  status, _ = fetch(base + "/v1/health")
                  if status == 200:
                      return None
                  return ("HEALTH_STATUS", f"/v1/health 응답 {status}")
              except urllib.error.HTTPError as error:
                  return ("HEALTH_STATUS", f"/v1/health 응답 {error.code}")
              except Exception as error:
                  return ("HEALTH_UNREACHABLE", f"/v1/health 접속 실패 ({type(error).__name__})")


          def previous_run_failed():
              """바로 앞에 끝난 실행이 실패였으면 True, 아니면 False, 읽지 못하면 None."""
              token = os.environ.get("GITHUB_TOKEN", "")
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              if not token or not repository:
                  return None
              api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              query = {"status": "completed", "per_page": "5"}
              if os.environ.get("GITHUB_REF_NAME"):
                  query["branch"] = os.environ["GITHUB_REF_NAME"]
              url = (
                  f"{api}/repos/{repository}/actions/workflows/monitor.yml/runs?"
                  + urllib.parse.urlencode(query)
              )
              try:
                  _, body = fetch(url, {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  current = os.environ.get("GITHUB_RUN_ID", "")
                  runs = [
                      run for run in json.loads(body)["workflow_runs"]
                      if str(run.get("id")) != current
                  ]
              except Exception as error:
                  print(f"앞 실행 결과를 읽지 못했습니다 ({type(error).__name__})")
                  return None
              return bool(runs) and runs[0].get("conclusion") in ("failure", "timed_out")


          def notify(text):
              hook = os.environ.get("ALERT_WEBHOOK_URL", "")
              if not hook:
                  print("ALERT_WEBHOOK_URL 비밀이 없어 알림 보내기는 건너뜁니다")
                  return
              # 디스코드는 content, 슬랙은 text 를 읽는다. 본문 글로 누구도 부르지 않는다.
              payload = json.dumps(
                  {"content": text, "text": text, "allowed_mentions": {"parse": []}}
              ).encode()
              try:
                  status, _ = fetch(hook, {"Content-Type": "application/json"}, payload)
                  print(f"알림을 보냈습니다 (응답 {status})")
              except urllib.error.HTTPError as error:
                  print(f"알림 보내기 실패 (응답 {error.code})")
              except Exception as error:
                  print(f"알림 보내기 실패 ({type(error).__name__})")


          problems = []  # (종류 코드, 웹훅에만 넣는 한국어 한 줄)
          health = check_health()
          if health is not None:
              # 배포 중 잠깐 끊긴 것일 수 있어 한 번 더 본다
              time.sleep(health_retry)
              health = check_health()
          if health is not None:
              problems.append(health)

          code = os.environ.get("OPS_MONITOR_CODE", "")
          if code:
              try:
                  status, body = fetch(base + "/ops/api/alerts", {"X-Ops-Code": code})
                  result = json.loads(body)
                  if result.get("ok") is not True:
                      found = []
                      for item in result.get("problems", []):
                          if not isinstance(item, dict):
                              continue
                          kind = str(item.get("code"))
                          kind = kind if code_pattern.fullmatch(kind) else "UNKNOWN"
                          found.append((kind, str(item.get("message") or kind)))
                      problems.extend(
                          found or [("ALERTS_NOT_OK", "장애 알림 확인 결과가 ok 가 아님")]
                      )
              except urllib.error.HTTPError as error:
                  problems.append(("ALERTS_STATUS", f"/ops/api/alerts 응답 {error.code}"))
              except Exception as error:
                  problems.append(
                      ("ALERTS_UNREACHABLE", f"/ops/api/alerts 확인 실패 ({type(error).__name__})")
                  )
          else:
              print("OPS_MONITOR_CODE 비밀이 없어 장애 알림 확인은 건너뜁니다")

          # 15분마다 같은 알림이 쏟아지지 않게, 앞 실행도 실패였으면 다시 보내지 않는다.
          # 앞 실행 결과를 읽지 못하면 놓치지 않도록 알림을 보내는 쪽으로 간다.
          failed_before = previous_run_failed()
          if not problems:
              print("이상 없음")
              if failed_before:
                  notify("콜록 운영 경보 해제: 다시 정상입니다")
              sys.exit(0)

          print("문제 종류: " + ", ".join(kind for kind, _ in problems))
          if failed_before:
              print("앞 실행도 실패여서 알림은 다시 보내지 않습니다")
          else:
              notify("콜록 운영 경보\n" + "\n".join(f"- {line}" for _, line in problems))
          sys.exit(1)
          PY
