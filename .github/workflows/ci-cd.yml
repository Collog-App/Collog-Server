name: CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/CI-CD]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups --python 3.12
      - name: Lint
        working-directory: backend
        run: |
          .venv/bin/ruff check app tests scripts
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test
        env:
          MOCK_EXTERNAL_SERVICES: "true"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/backend/tests" -q -p no:cacheprovider
      - name: Verify container build
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 --tag collog-ci backend

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: collog-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate deployment settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$latest" == "$GITHUB_SHA" ]] || { echo "A newer main commit exists, deploy that revision"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[^[:space:]]+$ ]]
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: collog-github-deploy
      - name: Build and publish immutable image
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          image_uri="$registry/$ECR_REPOSITORY:$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          existing=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" \
            --filter tagStatus=TAGGED --query 'imageIds[].imageTag' --output json)
          if ! IMAGE_TAGS="$existing" python3 -c \
            'import json, os, sys; sys.exit(os.environ["GITHUB_SHA"] not in json.loads(os.environ["IMAGE_TAGS"]))'
          then
            docker build --platform linux/amd64 --tag "$image_uri" backend
            docker push "$image_uri"
          fi
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
      - name: Deploy through Systems Manager
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shlex

          command = shlex.join([
              "/opt/collog/bin/deploy.sh", os.environ["IMAGE_URI"], os.environ["GITHUB_SHA"]
          ])
          parameters = {"commands": [command], "executionTimeout": ["1200"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "ssm-parameters.json").write_text(json.dumps(parameters))
          PY
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" --timeout-seconds 60 \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          for attempt in $(seq 1 150); do
            if aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" > "$RUNNER_TEMP/ssm-invocation.json" \
              2> "$RUNNER_TEMP/ssm-error.txt"
            then
              status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["Status"])' \
                "$RUNNER_TEMP/ssm-invocation.json")
              case "$status" in
                Pending|InProgress|Delayed) ;;
                *)
                  python3 - <<'PY'
          import json
          import os
          import pathlib

          result = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "ssm-invocation.json").read_text())
          print(result.get("StandardOutputContent", ""))
          print(result.get("StandardErrorContent", ""))
          print("Deployment status", result["Status"])
          PY
                  [[ "$status" == Success ]]
                  exit $?
                  ;;
              esac
            elif ! grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm-error.txt"; then
              cat "$RUNNER_TEMP/ssm-error.txt"
              exit 1
            fi
            sleep 10
          done
          aws ssm cancel-command --command-id "$command_id" --instance-ids "$EC2_INSTANCE_ID"
          echo "Deployment exceeded the polling timeout"
          exit 1
