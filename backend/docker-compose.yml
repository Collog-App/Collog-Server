x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://collog:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/collog
  SCHEMA_AUTO_RESET: "false"
  MOCK_EXTERNAL_SERVICES: "false"
  ALLOW_RAW_ONLY_ANALYSIS: "false"
  LOG_STT_TRANSCRIPT: "false"
  TEAM_PORTAL_ENABLED: "false"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  PUBLIC_BASE_URL: https://${API_DOMAIN:?Set API_DOMAIN}
  LIVEKIT_URL: wss://${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
  LIVEKIT_INTERNAL_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?Set S3_PUBLIC_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"
  SMS_PROVIDER: solapi
  SOLAPI_API_KEY: ${SOLAPI_API_KEY:?Set SOLAPI_API_KEY}
  SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:?Set SOLAPI_API_SECRET}
  SOLAPI_SENDER: ${SOLAPI_SENDER:?Set SOLAPI_SENDER}
  APNS_VOIP_ENABLED: "true"
  APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:?Set APNS_ENVIRONMENT}
  APNS_TEAM_ID: ${APNS_TEAM_ID:?Set APNS_TEAM_ID}
  APNS_KEY_ID: ${APNS_KEY_ID:?Set APNS_KEY_ID}
  APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:?Set APNS_BUNDLE_ID}
  APNS_PRIVATE_KEY_PATH: /run/secrets/apns.p8
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY}
  DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
  DEEPGRAM_LANGUAGE: ko
  GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
  QUESTION_TTS_PROVIDER: ${QUESTION_TTS_PROVIDER:-ios_local}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
  COUGH_DETECTOR_VALIDATED: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: collog
      POSTGRES_USER: collog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collog -d collog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
        webhook:
          api_key: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}"
          urls: ["http://backend:8080/v1/webhooks/livekit"]
        room:
          empty_timeout: 60
          departure_timeout: 20
        logging:
          level: info
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 12

  egress:
    image: livekit/egress:v1.12.0
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        health_port: 8081
        log_level: info
        enable_chrome_sandbox: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://collog:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/collog
    command: ["alembic", "upgrade", "head"]

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_healthy
      egress:
        condition: service_healthy
    environment: *backend-environment
    volumes:
      - type: bind
        source: ${APNS_KEY_FILE:?Set APNS_KEY_FILE}
        target: /run/secrets/apns.p8
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
