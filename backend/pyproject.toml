[project]
name = "collog-backend"
version = "0.1.0"
description = "Collog family-call health log API and processing pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.0",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "httpx[http2]>=0.28.0",
  "livekit-api>=1.0.7",
  "librosa>=0.11.0",
  "numpy>=2.2.0",
  "onnxruntime>=1.20.0",
  "pydantic-settings>=2.10.0",
  "pyjwt[crypto]>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
